<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TopUp Corner – ร้านเติมเกม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FF;--surface:#FFFFFF;--ink:#1A1538;--muted:#5E5985;--line:#DAD5F5;
  --accent:#FFB627;--accent-ink:#2A1B00;--hot:#E8326B;--ok:#0E9F6E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14102B;--surface:#1F1946;--ink:#F3F0FF;--muted:#A9A3D6;--line:#352E69;--ok:#3DDC97;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14102B;--surface:#1F1946;--ink:#F3F0FF;--muted:#A9A3D6;--line:#352E69;--ok:#3DDC97;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kanit","Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.banner{display:block;width:100%;height:auto;border-radius:14px;margin:4px 0 0}
.logo i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 8px}
.bar span{color:var(--muted);font-size:.9rem}
.auth{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap;justify-content:flex-end}
.auth b{display:inline-block;max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.auth button,.authpanel .acts button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:500}
.auth .primary,.authpanel .acts .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.authpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.authpanel h2{font-size:1.1rem;margin:0 0 10px}
.authpanel .row{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.authpanel .row{grid-template-columns:1fr 1fr}}
.authpanel input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.authpanel input:focus{border-color:var(--hot);outline:none}
.authpanel label{display:block;font-weight:500;margin-bottom:6px}
.authpanel .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.authpanel .acts button{padding:10px 16px}
.warn{font-size:.85rem;color:var(--muted);margin:10px 0 0}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.hero{padding:20px 0 8px}
h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.15;margin:0 0 8px;font-weight:700;max-width:16em}
.hero p{margin:0;color:var(--muted);max-width:34em}
.layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
@media (min-width:860px){.layout{grid-template-columns:1fr 340px;align-items:start}.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.step h2{font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.9rem;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;cursor:pointer;position:relative;min-height:56px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--hot);background:var(--surface);box-shadow:0 0 0 1px var(--hot)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--hot);font-weight:700}
.game{display:flex;flex-direction:column;gap:2px}
.game b{font-size:1.9rem;line-height:1}
.game small,.pkg small{color:var(--muted)}
.pkg b{font-size:1.15rem;display:block}
.pkg .price{font-weight:700;color:var(--hot)}
.field label{display:block;font-weight:500;margin-bottom:6px}
.field input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.field input:focus{border-color:var(--hot);outline:none}
.err{color:var(--hot);font-size:.9rem;min-height:1.4em;margin:6px 0 0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.pay{grid-template-columns:1fr}}
.ticket{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:150px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket h2{margin:0 0 12px;font-size:1.1rem}
.ticket dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.ticket dt{opacity:.75}.ticket dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.cut{border-top:2px dashed rgba(42,27,0,.45);margin:44px 0 14px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:2.4rem;line-height:1}
.buy{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--accent-ink);color:#FFF;font-weight:700;font-size:1.05rem;cursor:pointer}
.buy:hover{background:#000}
.done{animation:stamp .35s ease-out}
@keyframes stamp{from{transform:scale(1.06) rotate(-1.5deg);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.done{animation:none}}
.note{font-size:.85rem;margin:10px 0 0;opacity:.8}
footer{max-width:1080px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:.85rem}
</style>
</head>

  T.className="ticket";
  T.innerHTML="<h2>สรุปรายการ</h2><dl><dt>เกม</dt><dd>"+g.name+"</dd><dt>ไอดี</dt><dd>"+(uid||"-")+"</dd><dt>แพ็กเกจ</dt><dd>"+(pk?fmt(pk[0])+" "+g.cur:"-")+"</dd><dt>ชำระโดย</dt><dd>"+PAYS[S.pay]+"</dd></dl><div class=\"cut\"></div><div class=\"total\"><span>ยอดชำระ</span><b>฿"+(pk?fmt(pk[1]):"0")+"</b></div><button class=\"buy\" id=\"buy\" type=\"button\">สั่งซื้อและชำระเงิน</button><p class=\"note\" id=\"msg\"></p>";
  $("buy").onclick=submit;
}
function submit(){
  var g=GAMES[S.g],uid=$("uid").value.trim(),e=$("uidErr");
  if(!/^\d{6,12}$/.test(uid)){e.textContent="กรอกไอดีเป็นตัวเลข 6–12 หลัก";$("uid").focus();return}
  e.textContent="";
  if(S.p===null){$("msg").textContent="กรุณาเลือกแพ็กเกจก่อนสั่งซื้อ";return}
  var pk=g.p[S.p];
  S.done={no:"TC"+Date.now().toString().slice(-8),game:g.name,uid:uid,item:fmt(pk[0])+" "+g.cur,pay:PAYS[S.pay],price:pk[1],who:(window.curUser||"ผู้เยี่ยมชม")};
  if(window.curUser)ls("tc_uid_"+window.curUser,uid);
  ticket();
}
$("uid").addEventListener("input",function(){$("uidErr").textContent="";if(!S.done)ticket()});
var AM="login",MEM=[];
window.curUser=null;
function ls(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v)}catch(e){return null}}
function users(){var a=[];try{a=JSON.parse(ls("tc_users")||"[]")}catch(e){}return a.concat(MEM.filter(function(x){return a.indexOf(x)<0}))}
function mk(txt,cls,fn){var b=document.createElement("button");b.type="button";b.textContent=txt;if(cls)b.className=cls;b.onclick=fn;return b}
function authBar(){
  var A=$("auth");A.innerHTML="";
  if(window.curUser){
    var s=document.createElement("span");s.appendChild(document.createTextNode("สวัสดี "));
    var b=document.createElement("b");b.textContent=window.curUser;s.appendChild(b);A.appendChild(s);
    A.appendChild(mk("ออกจากระบบ","",function(){setUser(null)}));
  }else{
    A.appendChild(mk("เข้าสู่ระบบ","",function(){openAuth("login")}));
    A.appendChild(mk("สมัครสมาชิก","primary",function(){openAuth("reg")}));
  }
}
function openAuth(m){
  AM=m;var r=m==="reg";
  $("authpanel").hidden=false;
  $("authTitle").textContent=r?"สมัครสมาชิก":"เข้าสู่ระบบ";
  $("ago").textContent=r?"สมัครสมาชิก":"เข้าสู่ระบบ";
  $("aswitch").textContent=r?"มีบัญชีแล้ว เข้าสู่ระบบ":"สมัครสมาชิกใหม่";
  $("aerr").textContent="";$("au").focus();
}
function setUser(n){
  window.curUser=n;ls("tc_session",n||"");
  if(n){var u=ls("tc_uid_"+n);if(u){$("uid").value=u}}
  $("authpanel").hidden=true;authBar();S.done=null;ticket();
}
$("ago").onclick=function(){
  var n=$("au").value.trim(),p=$("ap").value,e=$("aerr"),L=users();
  if(!/^[A-Za-z0-9ก-๙_]{3,20}$/.test(n)){e.textContent="ชื่อผู้ใช้ 3–20 ตัว ใช้ตัวอักษร ตัวเลข หรือ _";return}
  if(p.length<4){e.textContent="รหัสผ่านจำลองอย่างน้อย 4 ตัวอักษร";return}
  if(AM==="reg"){
    if(L.indexOf(n)>-1){e.textContent="ชื่อผู้ใช้นี้ถูกใช้แล้ว ลองชื่ออื่นหรือเข้าสู่ระบบ";return}
    L.push(n);MEM.push(n);ls("tc_users",JSON.stringify(L));
  }else if(L.indexOf(n)<0){e.textContent="ไม่พบชื่อผู้ใช้นี้ ลองสมัครสมาชิกก่อน";return}
  $("au").value="";$("ap").value="";setUser(n);
};
$("aswitch").onclick=function(){openAuth(AM==="reg"?"login":"reg")};
$("acancel").onclick=function(){$("authpanel").hidden=true};
$("ap").addEventListener("keydown",function(ev){if(ev.key==="Enter"){$("ago").click()}});
render();
var s0=ls("tc_session");
if(s0&&users().indexOf(s0)>-1){setUser(s0)}else{authBar()}
</script>
</body>
</html>
